<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <header>
        <nav>
            <a href="#about-section">About</a>

        </nav>
<h1>&nbsp;&nbsp;EmeraldCorps&nbsp;&nbsp;</h1>
    </header>
<main class="input-section">
<wordle-for-good
  word="109-111-110-101-121"
  bg-color="#fafafa"
  text-color="#333333"
  tile-border-color="#888888"
  tile-bg-color="#ffffff"
  tile-bg-wrong-color="#39393c"
  tile-bg-wrong-location-color="#b59f3b"
  tile-bg-correct-color="#538d4e"
  tile-text-color="#333333"
  key-bg-color="#818283"
  key-text-color="#ffffff"
  key-text-size="1.3rem"
  height="690px"
  title="Wordle"
  success-selector="#success"
  failure-selector="#failure"
></wordle-for-good>
<div id="success" class="wordle-result">
</div>
<div id="failure" class="wordle-result" aria-live="assertive"></div>
<button type="button" id="wordle-continue" class="button" disabled>Continue</button>
</main>

></script>
