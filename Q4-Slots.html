<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <header>
        <nav>
            <a href="#about-section">About</a>
            <a href="#portfolio-section">Work</a>
            <a href="#contact-section">Contact</a>
        </nav>
<h1>&nbsp;&nbsp;EmeraldCorps&nbsp;&nbsp;</h1>
    </header>
<main class="input-section">
    <section class="slot-machine" aria-labelledby="slot-machine-title">
        <h2 id="slot-machine-title">Mini Slot Machine</h2>
        <div class="slot-reels" aria-live="polite">
            <div class="slot-reel" id="q4-slot-reel-1">🍒</div>
            <div class="slot-reel" id="q4-slot-reel-2">⭐</div>
            <div class="slot-reel" id="q4-slot-reel-3">💎</div>
        </div>
        <button type="button" id="q4-slot-spin-button">Spin</button>
        <p class="slot-message" id="q4-slot-message" role="status">Try your luck!</p>
    </section>
</main>
    <footer>
<p>&copy; 2025 Jon-Jon Rodriguez</p>        
    </footer>
    <script src="js/main.js"></script>

    <!-- SLOT MACHINE SCRIPT: Move this block to main.js when you are ready. -->
    <script>
        const q4SpinButton = document.getElementById('q4-slot-spin-button');

        if (q4SpinButton) {
            const q4Symbols = ['🍒', '⭐', '💎', '🍀', '🔔', '🍋'];
            const q4Reels = [...document.querySelectorAll('.slot-reel')];
            const q4Message = document.getElementById('q4-slot-message');

            q4SpinButton.addEventListener('click', () => {
                q4SpinButton.disabled = true;
                q4Message.textContent = 'Spinning...';
                q4Reels.forEach((reel) => reel.classList.add('is-spinning'));

                window.setTimeout(() => {
                    const result = q4Reels.map((reel) => {
                        const symbol = q4Symbols[Math.floor(Math.random() * q4Symbols.length)];
                        reel.textContent = symbol;
                        reel.classList.remove('is-spinning');
                        return symbol;
                    });

                    q4Message.textContent = result.every((symbol) => symbol === result[0])
                        ? 'Jackpot!'
                        : 'Thanks for spinning!';
                    q4SpinButton.disabled = false;
                }, 900);
            });
        }
    </script>
</body>
</html>
