<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <header>
        <nav>
            <a href="#about-section">About</a>
            <a href="#portfolio-section">Work</a>
            <a href="#contact-section">Contact</a>
        </nav>
<h1>&nbsp;&nbsp;EmeraldCorps&nbsp;&nbsp;</h1>
    </header>
<main class="input-section">
            <div class="survey-heading">
            <p class="eyebrow">EmeraldCorps application</p>
            <h2>Slot Machine Test</h2>
            <p>Please roll for a triple star on this slot machine to continue your application.</p>
        </div>
    <section class="slot-machine" aria-labelledby="slot-machine-title">
        <div class="slot-reels" aria-live="polite">
                <div class="slot-reel" id="q4-slot-reel-1"><span class="slot-symbol">🍒</span></div>
                <div class="slot-reel" id="q4-slot-reel-2"><span class="slot-symbol">⭐</span></div>
                <div class="slot-reel" id="q4-slot-reel-3"><span class="slot-symbol">💎</span></div>
        </div>
        <button type="button" id="q4-slot-spin-button">Spin</button>
        <p class="slot-message" id="q4-slot-message" role="status">Please roll for a triple star.</p>
    </section>
    <button type="button" id="q4-slot-continue" class="button" disabled>Continue</button>
</main>
    <footer>
<p>&copy; 2025 Jon-Jon Rodriguez</p>        
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
