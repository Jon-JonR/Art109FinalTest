<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Pad | EmeraldCorps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <header>
        <nav>
            <a href="#about-section">About</a>
            <a href="#portfolio-section">Work</a>
            <a href="#contact-section">Contact</a>
        </nav>
<h1>&nbsp;&nbsp;EmeraldCorps&nbsp;&nbsp;</h1>
    </header>
<main class="input-section">
    <section class="signature-page" aria-labelledby="signature-title">
        <h2 id="signature-title">Signature Pad Placeholder</h2>
        <p class="signature-instructions">Click and drag inside the box to draw your signature.</p>

        <div class="signature-canvas-wrap">
            <canvas id="signature-canvas" aria-label="Signature drawing canvas"></canvas>
            <img class="signature-pen-active" id="signature-pen-active" src="images/SignaturePen.webp" alt="Active signature pen">
        </div>

        <button class="signature-pen-trigger" id="signature-pen-trigger" type="button">
            <img class="signature-pen-lying" src="images/SignaturePenLying.png" alt="Click to pick up the signature pen">
        </button>
        <p class="signature-status" id="signature-status" role="status">Click the pen to begin drawing.</p>
    </section>
    <button type="button" id="signature-continue" class="button" disabled>Continue</button>
</main>
    <footer>
<p>&copy; 2025 Jon-Jon Rodriguez</p>        
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
