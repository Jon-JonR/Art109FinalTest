<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Pad | EmeraldCorps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .signature-page {
            width: min(94%, 52rem);
            margin: 0 auto 3rem;
            padding: clamp(1.25rem, 4vw, 2rem);
            border: 3px solid var(--accent-2);
            border-radius: 1rem;
            background: rgba(201, 211, 154, .48);
            box-shadow: 0 .35rem 0 var(--accent-2);
            color: var(--font);
            font-family: "Barlow Condensed", sans-serif;
            text-align: center;
        }

        .signature-page h2 {
            margin-bottom: .5rem;
            font-family: "Archivo Black", sans-serif;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
        }

        .signature-instructions {
            margin-bottom: 1rem;
            color: var(--accent-2);
            font-size: 1.2rem;
        }

        .signature-canvas-wrap {
            position: relative;
            width: 100%;
            margin: 0 auto 1.5rem;
            overflow: visible;
            border: 3px solid var(--accent-2);
            border-radius: .75rem;
            background: white;
            box-shadow: inset 0 0 .75rem rgba(43, 80, 68, .15);
        }

        #signature-canvas {
            display: block;
            width: 100%;
            height: 22rem;
            cursor: not-allowed;
            touch-action: none;
        }

        #signature-canvas.is-active {
            cursor: crosshair;
        }

        .signature-pen-active {
            position: absolute;
            z-index: 10;
            display: none;
            width: min(75vw, 28rem);
            pointer-events: none;
            /* The pen tip is at the lower-left of the image, so offset the
               overlay until that tip—not the image center—tracks the cursor. */
            transform: translate(-23%, -105%) rotate(-18deg);
        }

        .signature-pen-active.is-visible {
            display: block;
        }

        .signature-pen-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .signature-pen-trigger:hover {
            background: transparent;
        }

        .signature-pen-trigger.is-hidden {
            display: none;
        }

        .signature-pen-lying {
            display: block;
            width: min(98vw, 48rem);
            height: auto;
        }

        .signature-status {
            min-height: 1.5rem;
            margin-top: 1rem;
            color: var(--accent-2);
            font-size: 1.15rem;
            font-weight: 700;
        }
    </style>

</head>
<body>
    <header>
        <nav>
            <a href="#about-section">About</a>
            <a href="#portfolio-section">Work</a>
            <a href="#contact-section">Contact</a>
        </nav>
<h1>&nbsp;&nbsp;EmeraldCorps&nbsp;&nbsp;</h1>
    </header>
<main class="input-section">
    <section class="signature-page" aria-labelledby="signature-title">
        <h2 id="signature-title">Signature Pad Placeholder</h2>
        <p class="signature-instructions">Click and drag inside the box to draw your signature.</p>

        <div class="signature-canvas-wrap">
            <canvas id="signature-canvas" aria-label="Signature drawing canvas"></canvas>
            <img class="signature-pen-active" id="signature-pen-active" src="images/SignaturePen.webp" alt="Active signature pen">
        </div>

        <button class="signature-pen-trigger" id="signature-pen-trigger" type="button">
            <img class="signature-pen-lying" src="images/SignaturePenLying.png" alt="Click to pick up the signature pen">
        </button>
        <p class="signature-status" id="signature-status" role="status">Click the pen to begin drawing.</p>
    </section>
</main>
    <footer>
<p>&copy; 2025 Jon-Jon Rodriguez</p>        
    </footer>
    <script src="js/main.js"></script>
    <script>
        const signatureCanvas = document.getElementById("signature-canvas");
        const signatureCanvasWrap = document.querySelector(".signature-canvas-wrap");
        const signaturePenTrigger = document.getElementById("signature-pen-trigger");
        const signatureActivePen = document.getElementById("signature-pen-active");
        const signatureStatus = document.getElementById("signature-status");
        const signatureContext = signatureCanvas.getContext("2d");
        let signaturePenEnabled = false;
        let signatureDrawing = false;

        function resizeSignatureCanvas() {
            const previousImage = signatureCanvas.width && signatureCanvas.height
                ? signatureContext.getImageData(0, 0, signatureCanvas.width, signatureCanvas.height)
                : null;
            const scale = window.devicePixelRatio || 1;
            const bounds = signatureCanvas.getBoundingClientRect();
            signatureCanvas.width = Math.round(bounds.width * scale);
            signatureCanvas.height = Math.round(bounds.height * scale);
            signatureContext.setTransform(scale, 0, 0, scale, 0, 0);
            signatureContext.lineWidth = 4;
            signatureContext.lineCap = "round";
            signatureContext.lineJoin = "round";
            signatureContext.strokeStyle = "#2b5044";

            if (previousImage) {
                signatureContext.putImageData(previousImage, 0, 0);
            }
        }

        function canvasPoint(event) {
            const bounds = signatureCanvas.getBoundingClientRect();
            return {
                x: event.clientX - bounds.left,
                y: event.clientY - bounds.top
            };
        }

        function moveActivePen(event) {
            const canvasBounds = signatureCanvas.getBoundingClientRect();
            const wrapBounds = signatureCanvasWrap.getBoundingClientRect();
            signatureActivePen.style.left = `${event.clientX - canvasBounds.left}px`;
            signatureActivePen.style.top = `${event.clientY - canvasBounds.top}px`;
            signatureActivePen.style.maxWidth = `${wrapBounds.width * .75}px`;
        }

        signaturePenTrigger.addEventListener("click", () => {
            signaturePenEnabled = true;
            signaturePenTrigger.classList.add("is-hidden");
            signatureCanvas.classList.add("is-active");
            signatureActivePen.style.left = "50%";
            signatureActivePen.style.top = "50%";
            signatureActivePen.classList.add("is-visible");
            signatureStatus.textContent = "Pen ready. Click and drag to draw.";
        });

        signatureCanvas.addEventListener("pointerdown", event => {
            if (!signaturePenEnabled) return;
            signatureDrawing = true;
            signatureCanvas.setPointerCapture(event.pointerId);
            const point = canvasPoint(event);
            signatureContext.beginPath();
            signatureContext.moveTo(point.x, point.y);
            moveActivePen(event);
            signatureActivePen.classList.add("is-visible");
        });

        signatureCanvas.addEventListener("pointermove", event => {
            if (!signaturePenEnabled) return;
            moveActivePen(event);
            if (!signatureDrawing) return;
            const point = canvasPoint(event);
            signatureContext.lineTo(point.x, point.y);
            signatureContext.stroke();
        });

        function stopSignatureDrawing(event) {
            if (!signatureDrawing) return;
            signatureDrawing = false;
            if (event && signatureCanvas.hasPointerCapture(event.pointerId)) {
                signatureCanvas.releasePointerCapture(event.pointerId);
            }
            signatureContext.closePath();
        }

        signatureCanvas.addEventListener("pointerup", stopSignatureDrawing);
        signatureCanvas.addEventListener("pointercancel", stopSignatureDrawing);
        window.addEventListener("resize", resizeSignatureCanvas);
        resizeSignatureCanvas();
    </script>
</body>
</html>
