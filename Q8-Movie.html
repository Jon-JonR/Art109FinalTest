<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Timer | EmeraldCorps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>

    </style>

</head>
<body>
    <header>
        <nav>
            <a href="#about-section">About</a>
            <a href="#portfolio-section">Work</a>
            <a href="#contact-section">Contact</a>
        </nav>
<h1>&nbsp;&nbsp;EmeraldCorps&nbsp;&nbsp;</h1>
    </header>
<main class="input-section">
        <div class="survey-heading">
            <p class="eyebrow">EmeraldCorps application</p>
            <h2>Movie Survey</h2>
            <p>Please watch the movie, "Meet the Robinsons," to continue your application.</p>
        </div>

        <div class="movie-page">
        <div class="movie-embed">
            <!-- Replace the video ID below if you want to feature a different movie. -->
            <iframe
                id="movie-video"
                src="https://www.youtube.com/embed/6rYA_qd0KaA?si=jtB_1AnHfQWw3PY5&enablejsapi=1"
                title="Movie trailer"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <div class="movie-timer-label">Time Remaining</div>
        <div class="movie-timer" id="movie-timer" role="timer" aria-live="polite">01:33:40</div>
        <p class="movie-status" id="movie-status">Press play on the video to begin the timer.</p>
        <button type="button" id="movie-fast-forward" class="movie-fast-forward" data-tooltip="Hold to fast-forward" aria-label="Hold to fast-forward the movie">»</button>
        </div>
    <button type="button" id="movie-continue" class="button" disabled>Continue</button>
</main>
    <footer>
<p>&copy; 2025 Jon-Jon Rodriguez</p>        
    </footer>
    <script src="js/main.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
