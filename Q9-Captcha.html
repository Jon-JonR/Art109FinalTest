<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA Check | EmeraldCorps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>

    </style>

</head>
<body>
    <header>
        <nav>
            <a href="#about-section">About</a>
            <a href="#portfolio-section">Work</a>
            <a href="#contact-section">Contact</a>
        </nav>
<h1>&nbsp;&nbsp;EmeraldCorps&nbsp;&nbsp;</h1>
    </header>
<main class="input-section">
    <section class="captcha-page" aria-labelledby="captcha-title">
        <h2 id="captcha-title">Quick CAPTCHA Check</h2>
        <p class="captcha-instructions">Type the letters shown in the image.</p>

        <img class="captcha-image" src="images/captcha.png" alt="CAPTCHA image">

        <form class="captcha-form" id="captcha-form">
            <label for="captcha-answer">Your answer</label>
            <input id="captcha-answer" name="captcha-answer" type="text" autocomplete="off" required>
            <button type="submit">Verify</button>
        </form>
        <p class="captcha-message" id="captcha-message" role="status" aria-live="polite"></p>
    </section>
    <button type="button" id="captcha-continue" class="button" disabled>Continue</button>
</main>
    <footer>
<p>&copy; 2025 Jon-Jon Rodriguez</p>        
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
