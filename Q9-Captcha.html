<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA Check | EmeraldCorps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .captcha-page {
            width: min(92%, 34rem);
            margin: 0 auto 3rem;
            padding: clamp(1.25rem, 4vw, 2rem);
            border: 3px solid var(--accent-2);
            border-radius: 1rem;
            background: rgba(201, 211, 154, .48);
            box-shadow: 0 .35rem 0 var(--accent-2);
            color: var(--font);
            font-family: "Barlow Condensed", sans-serif;
            text-align: center;
        }

        .captcha-page h2 {
            margin-bottom: .5rem;
            font-family: "Archivo Black", sans-serif;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
        }

        .captcha-instructions {
            margin-bottom: 1rem;
            color: var(--accent-2);
            font-size: 1.2rem;
        }

        .captcha-image {
            display: block;
            width: 100%;
            height: auto;
            margin-bottom: 1rem;
            border: 3px solid var(--accent-2);
            border-radius: .5rem;
            background: white;
        }

        .captcha-form {
            display: grid;
            gap: .75rem;
        }

        .captcha-form label {
            color: var(--accent-2);
            font-size: 1.2rem;
            font-weight: 700;
            text-align: left;
        }

        .captcha-form input {
            width: 100%;
            padding: .75rem 1rem;
            border: 2px solid var(--accent-2);
            border-radius: .5rem;
            color: var(--font);
            font: 1.2rem "Barlow Condensed", sans-serif;
        }

        .captcha-form button {
            width: 100%;
        }

        .captcha-message {
            min-height: 1.5rem;
            margin-top: .25rem;
            color: var(--accent-2);
            font-size: 1.15rem;
            font-weight: 700;
        }

        .captcha-message.is-success {
            color: var(--accent-2);
        }

        .captcha-message.is-error {
            color: #9b2727;
        }
    </style>

</head>
<body>
    <header>
        <nav>
            <a href="#about-section">About</a>
            <a href="#portfolio-section">Work</a>
            <a href="#contact-section">Contact</a>
        </nav>
<h1>&nbsp;&nbsp;EmeraldCorps&nbsp;&nbsp;</h1>
    </header>
<main class="input-section">
    <section class="captcha-page" aria-labelledby="captcha-title">
        <h2 id="captcha-title">Quick CAPTCHA Check</h2>
        <p class="captcha-instructions">Type the letters shown in the image.</p>

        <img class="captcha-image" src="images/captcha.png" alt="CAPTCHA image">

        <form class="captcha-form" id="captcha-form">
            <label for="captcha-answer">Your answer</label>
            <input id="captcha-answer" name="captcha-answer" type="text" autocomplete="off" required>
            <button type="submit">Verify</button>
        </form>
        <p class="captcha-message" id="captcha-message" role="status" aria-live="polite"></p>
    </section>
</main>
    <footer>
<p>&copy; 2025 Jon-Jon Rodriguez</p>        
    </footer>
    <script src="js/main.js"></script>
    <script>
        const captchaForm = document.getElementById("captcha-form");
        const captchaAnswer = document.getElementById("captcha-answer");
        const captchaMessage = document.getElementById("captcha-message");
        const captchaSolution = "Imascam";

        captchaForm.addEventListener("submit", event => {
            event.preventDefault();
            const answer = captchaAnswer.value.trim();
            const isCorrect = answer === captchaSolution;

            captchaMessage.className = `captcha-message ${isCorrect ? "is-success" : "is-error"}`;
            captchaMessage.textContent = isCorrect
                ? "Correct! CAPTCHA verified."
                : "That answer is incorrect. Please try again.";

            if (isCorrect) {
                captchaAnswer.disabled = true;
                captchaForm.querySelector("button").disabled = true;
            } else {
                captchaAnswer.focus();
                captchaAnswer.select();
            }
        });
    </script>
</body>
</html>
